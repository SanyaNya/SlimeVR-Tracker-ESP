; PlatformIO 项目配置文件
;
;   构建选项：构建标志、源过滤器
;   上传选项：自定义上传端口、速度和额外标志
;   库选项：依赖项、额外的库存储
;   高级选项：额外脚本
;

; ================================================
; 查看文档了解配置选项和示例：
; https://docs.slimevr.dev/firmware/configuring-project.html#1-configuring-platformioini
; ================================================

[platformio]
build_cache_dir = cache
default_envs = BOARD_WEMOSD1MINI

[env]
lib_deps=
  https://github.com/SlimeVR/CmdParser.git
  https://github.com/SlimeVR/base64_arduino.git
  https://github.com/adafruit/Adafruit-MCP23017-Arduino-Library.git
  https://github.com/hideakitai/PCA9547.git
monitor_speed = 115200
monitor_echo = yes
monitor_filters = colorize
;monitor_rts = 0
;monitor_dtr = 0
framework = arduino
extra_scripts =
  pre:scripts/preprocessor.py
  pre:scripts/compiledb_settings.py
build_flags =
  !python scripts/get_git_commit.py
  !python scripts/compiledb.py

  -DFIRMWARE_VERSION='"0.7.3"'
;If you want to set hardcoded WiFi SSID and password, uncomment and edit the lines below
;To uncomment, only remove ";" and leave the two spaces in front of the tags
; '" - quotes are necessary!
  -DWIFI_CREDS_SSID='"YOUR_WIFI_SSID"'
  -DWIFI_CREDS_PASSWD='"YOUR_WIFI_PASSWORD"'

;如果要设置静态IP地址，请取消注释并编辑下面的行
;  -DWIFI_USE_STATICIP
;  -DWIFI_STATIC_IP=192,168,XXX,XXX
;  -DWIFI_STATIC_GATEWAY=192,168,XXX,XXX
;  -DWIFI_STATIC_SUBNET=255,255,255,0

;  -DSERVER_IP='"192.168.XXX.XXX"'
;  -DSERVER_PORT=6969

; 如果您的板使用40MHz晶体而不是26MHz晶体（针对ESP8266），请取消注释下面的行
;  -DF_CRYSTAL=40000000

; 启用 -O2 GCC 优化
  -O2 # 启用 -O2 GCC 优化
  -std=gnu++2a # 设置C++标准为gnu++2a

build_unflags = -Os -std=gnu++11 -std=gnu++17 # 从构建标志中移除-Os、-std=gnu++11和-std=gnu++17，以避免与-O2优化和gnu++2a标准的冲突

; 如果要启用OTA更新，请取消注释并在这里和credentials.h中设置OTA密码
; 首次设置后，可以将upload_port设置为设备的IP地址
; 在SlimeVR Server中使用相同的密码以启用设备的OTA更新
; upload_protocol = espota
; upload_port = 192.168.1.49
; upload_flags =
;   --auth=SlimeVR-OTA

; 如果要为ESP-01构建，请取消注释下面的行
;[env:esp01_1m]
;platform = espressif8266 @ 4.2.1
;board = esp01_1m
;board_build.arduino.ldscript = "eagle.flash.1m64.ld"

[env:BOARD_WEMOSD1MINI] # 构建环境配置
platform = espressif8266 @ 4.2.1 # 设置平台为ESPpressif8266，版本为4.2.1
board = esp12e # 设置板为ESP12E
custom_slime_board = BOARD_WEMOSD1MINI
upload_speed = 921600

[env:BOARD_NODEMCU]
platform = espressif8266 @ 4.2.1
board = esp12e
custom_slime_board = BOARD_NODEMCU
upload_speed = 921600

[env:BOARD_TTGO_TBASE]
platform = espressif8266 @ 4.2.1
board = esp12e
custom_slime_board = BOARD_TTGO_TBASE
upload_speed = 921600

[env:BOARD_WEMOSWROOM02]
platform = espressif8266 @ 4.2.1
board = esp12e
custom_slime_board = BOARD_WEMOSWROOM02
upload_speed = 921600

[env:BOARD_WROOM32]
platform = espressif32 @ 6.7.0
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.1
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.0.1/esp32-arduino-libs-3.0.1.zip
board = esp32dev
custom_slime_board = BOARD_WROOM32

[env:BOARD_ESP01]
platform = espressif8266 @ 4.2.1
board = esp01_1m
board_build.arduino.ldscript = "eagle.flash.1m64.ld"
custom_slime_board = BOARD_ESP01
upload_speed = 921600

[env:BOARD_LOLIN_C3_MINI]
platform = espressif32 @ 6.7.0
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.1
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.0.1/esp32-arduino-libs-3.0.1.zip
custom_slime_board = BOARD_LOLIN_C3_MINI
build_flags = 
  ${env.build_flags}
  -DESP32C3
board = lolin_c3_mini
monitor_filters = colorize, esp32_exception_decoder
; 如果要使用ESP32C3，可以使用此选项（实验性）
; 在 https://docs.platformio.org/en/latest/platforms/espressif32.html#boards 检查您的板名称
; 有2种主要的板类型：
; 1. 使用USB 2串行芯片集的板（esp32-c3-devkitm-1、ttgo-t-oi-plus）
; 2. 依赖ESP32C3的USB接口的板（lolin_c3_mini、dfrobot_beetle_esp32c3）
;    对于此板，有2种类型，其中一些需要设置构建标志（menuconfig）
;    -DARDUINO_USB_MODE=1
;    -DARDUINO_USB_CDC_ON_BOOT=1

[env:BOARD_BEETLE32C3]
platform = espressif32 @ 6.7.0
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.1
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.0.1/esp32-arduino-libs-3.0.1.zip
custom_slime_board = BOARD_BEETLE32C3
build_flags = 
  ${env.build_flags}
  -DESP32C3
board = dfrobot_beetle_esp32c3
monitor_filters = colorize, esp32_exception_decoder
; 如果要使用ESP32C3，可以使用此选项（实验性）
; 在 https://docs.platformio.org/en/latest/platforms/espressif32.html#boards 检查您的板名称
; 有2种主要的板类型：
; 1. 使用USB 2串行芯片集的板（esp32-c3-devkitm-1、ttgo-t-oi-plus）
; 2. 依赖ESP32C3的USB接口的板（lolin_c3_mini、dfrobot_beetle_esp32c3）
;    对于此板，有2种类型，其中一些需要设置构建标志（menuconfig）
;    -DARDUINO_USB_MODE=1
;    -DARDUINO_USB_CDC_ON_BOOT=1

[env:BOARD_ESP32C3DEVKITM1]
platform = espressif32 @ 6.7.0
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.1
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.0.1/esp32-arduino-libs-3.0.1.zip
custom_slime_board = BOARD_ESP32C3DEVKITM1
build_flags = 
  ${env.build_flags}
  -DESP32C3
board = esp32-c3-devkitm-1
monitor_filters = colorize, esp32_exception_decoder
; 如果要使用ESP32C3，可以使用此选项（实验性）
; 在 https://docs.platformio.org/en/latest/platforms/espressif32.html#boards 检查您的板名称
; 有2种主要的板类型：
; 1. 使用USB 2串行芯片集的板（esp32-c3-devkitm-1、ttgo-t-oi-plus）
; 2. 依赖ESP32C3的USB接口的板（lolin_c3_mini、dfrobot_beetle_esp32c3）
;    对于此板，有2种类型，其中一些需要设置构建标志（menuconfig）
;    -DARDUINO_USB_MODE=1
;    -DARDUINO_USB_CDC_ON_BOOT=1

[env:BOARD_ESP32C6DEVKITC1]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.06.11/platform-espressif32.zip
custom_slime_board = BOARD_ESP32C6DEVKITC1
build_flags =
  ${env.build_flags}
  -DESP32C6
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
board = esp32-c6-devkitc-1

[env:BOARD_XIAO_ESP32C3]
platform = espressif32 @ 6.7.0
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.1
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.0.1/esp32-arduino-libs-3.0.1.zip
custom_slime_board = BOARD_XIAO_ESP32C3
build_flags = 
  ${env.build_flags}
  -DESP32C3
board = seeed_xiao_esp32c3
monitor_filters = colorize, esp32_exception_decoder

[env:BOARD_ESP32S3_SUPERMINI]
platform = espressif32 @ 6.7.0
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.1
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.0.1/esp32-arduino-libs-3.0.1.zip
custom_slime_board = BOARD_ESP32S3_SUPERMINI
build_flags = 
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DESP32S3
board = esp32s3_supermini
board_upload.use_1200bps_touch = 1
board_upload.wait_for_upload_port = 1
board_upload.require_upload_port = 1
upload_speed = 921600

[env:BOARD_SLIMEVR]
platform = espressif8266 @ 4.2.1
board = esp12e
custom_slime_board = BOARD_SLIMEVR
build_flags =
  ${env.build_flags}
  -D VENDOR_NAME='"SlimeVR"'
  -D VENDOR_URL='"https://slimevr.dev"'
  -D PRODUCT_NAME='"SlimeVR Tracker"'
  -D UPDATE_ADDRESS='"SlimeVR/SlimeVR-Tracker-ESP"'
  -D UPDATE_NAME='"BOARD_SLIMEVR-firmware"'

[env:BOARD_SLIMEVR_V1_2]
platform = espressif8266 @ 4.2.1
board = esp12e
custom_slime_board = BOARD_SLIMEVR_V1_2
build_flags =
  ${env.build_flags}
  -D VENDOR_NAME='"SlimeVR"'
  -D VENDOR_URL='"https://slimevr.dev"'
  -D PRODUCT_NAME='"SlimeVR Tracker v1.2"'
  -D UPDATE_ADDRESS='"SlimeVR/SlimeVR-Tracker-ESP"'
  -D UPDATE_NAME='"BOARD_SLIMEVR_V1_2-firmware"'

[env:BOARD_SLIMEVR_DEV]
platform = espressif8266 @ 4.2.1
board = esp12e
custom_slime_board = BOARD_SLIMEVR_DEV
build_flags =
  ${env.build_flags}
  -D VENDOR_NAME='"SlimeVR"'
  -D PRODUCT_NAME='"SlimeVR Tracker (dev)"'

[env:BOARD_GLOVE_IMU_SLIMEVR_DEV]
platform = espressif32 @ 6.7.0
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.1
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.0.1/esp32-arduino-libs-3.0.1.zip
build_flags = 
  ${env.build_flags}
  -D BOARD=BOARD_GLOVE_IMU_SLIMEVR_DEV
  -DESP32C3
  -D PRODUCT_NAME='"SlimeVR Glove (dev)"'
board = lolin_c3_mini
monitor_filters = colorize, esp32_exception_decoder
